name: CI/CD SchoolManager

on:
  push:
    branches: [ "main", "AxeellCevallos" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ETAPA 1: VALIDACIÓN (Compilar código para asegurar que no tenga errores)
  validate-code:
    name: Validar Compilación del Proyecto
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar git diff --check (espacios en blanco / conflictos)
        run: |
          git fetch origin main --quiet
          base="$(git merge-base origin/main HEAD)"
          echo "Comparando contra base $base"
          git diff --check "$base"..HEAD

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verificar frontera API del frontend (deuda 10)
        run: python3 scripts/check-frontend-api-boundary.py

      - name: Validar Backend (.NET)
        run: |
          dotnet restore backend/SchoolManager.API/SchoolManager.API.csproj
          dotnet build backend/SchoolManager.API/SchoolManager.API.csproj --configuration Release

      - name: Ejecutar tests de identidad y autorizacion
        run: dotnet test tests/SchoolManager.API.IntegrationTests/SchoolManager.API.IntegrationTests.csproj --configuration Release --collect:"XPlat Code Coverage" --settings tests/SchoolManager.API.IntegrationTests/coverlet.runsettings --results-directory coverage-backend
        continue-on-error: false

      - name: Subir cobertura backend (cobertura.xml) como artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend-cobertura
          path: coverage-backend/**/coverage.cobertura.xml
          if-no-files-found: error

      - name: Ejecutar tests de base de datos
        run: dotnet test tests/SchoolManager.Database.IntegrationTests/SchoolManager.Database.IntegrationTests.csproj --configuration Release

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: frontend/schoolmanager-frontend/package-lock.json

      - name: Configurar npm
        run: npm install -g npm@11.13.0 --ignore-scripts

      - name: Validar Frontend (Angular)
        run: |
          cd frontend/schoolmanager-frontend
          npm ci --ignore-scripts

      - name: Ejecutar tests unitarios del frontend (headless, con cobertura lcov)
        run: |
          cd frontend/schoolmanager-frontend
          npm test -- --watch=false
        continue-on-error: false

      - name: Subir cobertura frontend (lcov.info) como artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend-lcov
          path: frontend/schoolmanager-frontend/coverage/**/lcov.info
          if-no-files-found: error

      - name: Gate de cobertura (deuda #9, regresiones frente a baseline)
        run: |
          python3 scripts/check-coverage-gate.py \
            --backend coverage-backend/**/coverage.cobertura.xml \
            --frontend frontend/schoolmanager-frontend/coverage/**/lcov.info
        continue-on-error: false

      - name: Validar Frontend (Angular)
        run: |
          cd frontend/schoolmanager-frontend
          npm run build -- --configuration production

  # ETAPA 1.5: ANÁLISIS SONARCLOUD (requiere SONAR_TOKEN)
  # -----------------------------------------------------------------------------
  # Bloque 029B (análisis C# real): el job se crea SIEMPRE (así GitHub Actions
  # genera runs) y la presencia del secret SONAR_TOKEN se lee via env (no
  # evaluando secrets.* en un if del workflow). El análisis usa el SonarScanner
  # for .NET (flujo begin -> build -> end), el ÚNICO capaz de hacer análisis
  # estático real del backend .NET (el scanner genérico no analiza .cs).
  #
  # IMPORTANTE: SonarScanner for .NET NO lee sonar-project.properties. Por eso
  # todas las propiedades del análisis CI van como /d: en el begin.
  sonarcloud:
    name: Análisis SonarCloud (CI Analysis)
    needs: validate-code
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar cobertura backend
        uses: actions/download-artifact@v4
        with:
          name: coverage-backend-cobertura
          path: coverage-backend

      - name: Descargar cobertura frontend
        uses: actions/download-artifact@v4
        with:
          name: coverage-frontend-lcov
          path: frontend/schoolmanager-frontend/coverage

      - name: Fallar si SONAR_TOKEN está vacío (anti falso-verde)
        if: ${{ env.SONAR_TOKEN == '' }}
        run: |
          echo "::error::SONAR_TOKEN no está configurado: el análisis de SonarCloud no pudo ejecutarse."
          echo "Este check queda en rojo a propósito para que un job interno nunca"
          echo "aparezca verde sin haber analizado realmente."
          echo "Configura el secret 'SONAR_TOKEN' (ver docs/ci/sonarcloud-token-setup.md)."
          exit 1

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Instalar SonarScanner for .NET (11.3.0, pin fijo para reproducibilidad)
        run: dotnet tool install --global dotnet-sonarscanner --version 11.3.0

      - name: Agregar dotnet-tools al PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: SonarScanner .NET — begin (configura análisis C# + TS)
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          REF: ${{ github.ref_name }}
        run: |
          set -f
          ARGS="/k:SchoolManager /o:acevallos31 /d:sonar.token=${SONAR_TOKEN}"
          ARGS="${ARGS} /d:sonar.host.url=https://sonarcloud.io"
          ARGS="${ARGS} /d:sonar.scanner.scanAll=true"
          ARGS="${ARGS} /d:sonar.sourceEncoding=UTF-8"
          ARGS="${ARGS} /d:sonar.exclusions=**/node_modules/**,**/dist/**,**/bin/**,**/obj/**,**/coverage/**,**/*.min.js,coverage-backend/**,**/lcov.info,**/*.cobertura.xml,**/*.spec.ts,**/*.test.ts,e2e/**"
          # El baseline es un artefacto consolidado de bootstrap que replica migraciones
          # ya analizadas. Se excluye únicamente de CPD para no inflar duplicación.
          ARGS="${ARGS} /d:sonar.cpd.exclusions=database/baseline/**"
          ARGS="${ARGS} /d:sonar.cs.cobertura.reportsPaths=coverage-backend/**/coverage.cobertura.xml"
          ARGS="${ARGS} /d:sonar.typescript.lcov.reportPaths=frontend/schoolmanager-frontend/coverage/**/lcov.info"
          if [ -n "${PR}" ]; then
            ARGS="${ARGS} /d:sonar.pullrequest.key=${PR} /d:sonar.pullrequest.branch=${HEAD} /d:sonar.pullrequest.base=${BASE}"
          else
            ARGS="${ARGS} /d:sonar.branch.name=${REF}"
          fi
          echo "=== Iniciando SonarScanner for .NET (PR=${PR:-branch:$REF}) ==="
          dotnet sonarscanner begin ${ARGS}

      - name: Compilar Backend bajo el analizador (análisis estático C#)
        run: |
          dotnet build backend/SchoolManager.API/SchoolManager.API.csproj --configuration Release
          dotnet build tests/SchoolManager.API.IntegrationTests/SchoolManager.API.IntegrationTests.csproj --configuration Release
          dotnet build tests/SchoolManager.Database.IntegrationTests/SchoolManager.Database.IntegrationTests.csproj --configuration Release

      - name: SonarScanner .NET — end (subir análisis)
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

      - name: Verificar Quality Gate (SonarCloud)
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          scanMetadataReportFile: .sonarqube/out/.sonar/report-task.txt

      - name: Reportar condiciones del Quality Gate y hallazgos del PR
        if: ${{ always() && github.event_name == 'pull_request' && env.SONAR_TOKEN != '' }}
        env:
          SONAR_PR: ${{ github.event.pull_request.number }}
        run: python3 scripts/report-sonar-quality.py

  # ETAPA 2: DESPLIEGUE (Solo se ejecuta si la etapa anterior pasa Y estamos en la rama main)
  deploy:
    name: Desplegar a Producción
    needs: validate-code
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Desplegar Backend a Render
        continue-on-error: true
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Frontend desplegado por integracion de Vercel
        run: |
          echo "El frontend se despliega automaticamente desde la rama main mediante la integracion Git de Vercel."
