name: CI/CD SchoolManager

on:
  push:
    branches: [ "main", "AxeellCevallos" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ETAPA 1: VALIDACIÓN (Compilar código para asegurar que no tenga errores)
  validate-code:
    name: Validar Compilación del Proyecto
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar git diff --check (espacios en blanco / conflictos)
        run: |
          git fetch origin main --quiet
          base="$(git merge-base origin/main HEAD)"
          echo "Comparando contra base $base"
          git diff --check "$base"..HEAD

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validar Backend (.NET)
        run: |
          dotnet restore backend/SchoolManager.API/SchoolManager.API.csproj
          dotnet build backend/SchoolManager.API/SchoolManager.API.csproj --configuration Release

      - name: Ejecutar tests de identidad y autorizacion
        run: dotnet test tests/SchoolManager.API.IntegrationTests/SchoolManager.API.IntegrationTests.csproj --configuration Release --collect:"XPlat Code Coverage" --settings tests/SchoolManager.API.IntegrationTests/coverlet.runsettings --results-directory coverage-backend
        continue-on-error: false

      - name: Subir cobertura backend (cobertura.xml) como artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend-cobertura
          path: coverage-backend/**/coverage.cobertura.xml
          if-no-files-found: error

      - name: Ejecutar tests de base de datos
        run: dotnet test tests/SchoolManager.Database.IntegrationTests/SchoolManager.Database.IntegrationTests.csproj --configuration Release

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: frontend/schoolmanager-frontend/package-lock.json

      - name: Configurar npm
        run: npm install -g npm@11.13.0 --ignore-scripts

      - name: Validar Frontend (Angular)
        run: |
          cd frontend/schoolmanager-frontend
          npm ci --ignore-scripts

      - name: Ejecutar tests unitarios del frontend (headless, con cobertura lcov)
        run: |
          cd frontend/schoolmanager-frontend
          npm test -- --watch=false
        continue-on-error: false

      - name: Subir cobertura frontend (lcov.info) como artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend-lcov
          path: frontend/schoolmanager-frontend/coverage/**/lcov.info
          if-no-files-found: error

      - name: Gate de cobertura (deuda #9, regresiones frente a baseline)
        run: |
          python3 scripts/check-coverage-gate.py \
            --backend coverage-backend/**/coverage.cobertura.xml \
            --frontend frontend/schoolmanager-frontend/coverage/**/lcov.info
        continue-on-error: false

      - name: Validar Frontend (Angular)
        run: |
          cd frontend/schoolmanager-frontend
          npm run build -- --configuration production

  # ETAPA 1.5: ANÁLISIS SONARCLOUD (requiere SONAR_TOKEN)
  # -----------------------------------------------------------------------------
  # Anti falso-verde (Bloque 029): el job se crea SIEMPRE (así GitHub Actions
  # genera runs) y la presencia del secret SONAR_TOKEN se lee via env (no
  # evaluando secrets.* en un if del workflow). El análisis usa la action
  # oficial de SonarQube Cloud, que FALLA si SONAR_TOKEN está vacío; además,
  # un paso GUARD redundante hace fallar el job con un error explícito si el
  # secret no está configurado. De este modo un job interno NUNCA puede quedar
  # verde silenciosamente sin haber subido análisis a SonarCloud.
  #
  # Configuración del secret (acción humana, ver docs/ci/sonarcloud-token-setup.md):
  #   gh secret set SONAR_TOKEN   (en el repositorio, o en la organización)
  # Valor: análisis token de SonarCloud (generado en la cuenta SonarCloud).
  # El token es un secret de GitHub Actions y NO debe commitearse ni imprimirse.
  #
  # No bloquea el despliegue (deploy solo depende de validate-code). Cuando
  # SONAR_TOKEN falta, este check queda en rojo A PROPÓSITO hasta configurarlo.
  # La desactivación de Automatic Analysis es un paso manual del usuario en el
  # panel de SonarCloud (ver docs/handoffs/020.5A-hardening-ci.md).
  sonarcloud:
    name: Análisis SonarCloud (CI Analysis)
    needs: validate-code
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar cobertura backend
        uses: actions/download-artifact@v4
        with:
          name: coverage-backend-cobertura
          path: coverage-backend

      - name: Descargar cobertura frontend
        uses: actions/download-artifact@v4
        with:
          name: coverage-frontend-lcov
          path: frontend/schoolmanager-frontend/coverage

      # Action oficial de SonarQube Cloud (SonarSource/sonarqube-scan-action).
      # Sustituye al sonar-scanner-cli 7.1.0.12063 descargado manualmente
      # (wget + unzip), cuyo wrapper moría con exit code 8 sin imprimir nada.
      # Ventajas: descarga y gestiona su propio scanner, auto-aprovisiona su JRE
      # (no requiere actions/setup-java) y valida internamente SONAR_TOKEN.
      # Lee sonar-project.properties de la raíz (projectKey=SchoolManager,
      # organization=acevallos31, sources/tests y rutas de cobertura) y usa
      # SONAR_TOKEN del entorno. Versión fijada a v8.2.1 (estable, 2026-07-15).
      - name: Analizar con la action oficial de SonarCloud (lee sonar-project.properties)
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_HOST_URL: https://sonarcloud.io

      # GUARD anti falso-verde (Bloque 029): si el análisis no pudo arrancar
      # porque SONAR_TOKEN está vacío, fallar con un mensaje accionable en vez
      # de reportar verde en silencio.
      - name: Fallar si SONAR_TOKEN está vacío (anti falso-verde)
        if: ${{ env.SONAR_TOKEN == '' }}
        run: |
          echo "::error::SONAR_TOKEN no está configurado: el análisis de SonarCloud no pudo ejecutarse."
          echo "Este check queda en rojo a propósito para que un job interno nunca"
          echo "aparezca verde sin haber analizado realmente."
          echo "Configura el secret 'SONAR_TOKEN' (ver docs/ci/sonarcloud-token-setup.md)."
          exit 1

  # ETAPA 2: DESPLIEGUE (Solo se ejecuta si la etapa anterior pasa Y estamos en la rama main)
  deploy:
    name: Desplegar a Producción
    needs: validate-code
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Desplegar Backend a Render
        continue-on-error: true
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Frontend desplegado por integracion de Vercel
        run: |
          echo "El frontend se despliega automaticamente desde la rama main mediante la integracion Git de Vercel."
