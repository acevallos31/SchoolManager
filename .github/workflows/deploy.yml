name: CI/CD SchoolManager

on:
  push:
    branches: [ "main", "AxeellCevallos" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ETAPA 1: VALIDACIÓN (Compilar código para asegurar que no tenga errores)
  validate-code:
    name: Validar Compilación del Proyecto
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          fetch-depth: 0

      - name: Verificar git diff --check (espacios en blanco / conflictos)
        run: |
          git fetch origin main --quiet
          base="$(git merge-base origin/main HEAD)"
          echo "Comparando contra base $base"
          git diff --check "$base"..HEAD

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0, Node 24
        with:
          dotnet-version: '10.0.x'

      - name: Verificar frontera API del frontend (deuda 10)
        run: python3 scripts/check-frontend-api-boundary.py

      - name: Validar Backend (.NET)
        run: |
          dotnet restore backend/SchoolManager.API/SchoolManager.API.csproj
          dotnet build backend/SchoolManager.API/SchoolManager.API.csproj --configuration Release

      - name: Ejecutar tests de identidad y autorizacion
        run: dotnet test tests/SchoolManager.API.IntegrationTests/SchoolManager.API.IntegrationTests.csproj --configuration Release --collect:"XPlat Code Coverage" --settings tests/SchoolManager.API.IntegrationTests/coverlet.runsettings --results-directory coverage-backend
        continue-on-error: false

      - name: Subir cobertura backend (cobertura.xml) como artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: coverage-backend-cobertura
          path: coverage-backend/**/coverage.cobertura.xml
          if-no-files-found: error

      - name: Ejecutar tests de base de datos
        run: dotnet test tests/SchoolManager.Database.IntegrationTests/SchoolManager.Database.IntegrationTests.csproj --configuration Release

      - name: Validar foundation backend staging local
        run: |
          python3 -m py_compile scripts/e2e/bootstrap-local-staging.py
          python3 scripts/e2e/bootstrap-local-staging.py --help > /dev/null
          python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path('supabase/config.toml').read_text(encoding='utf-8'))
          assert config['project_id'] == 'schoolmanager-e2e'
          assert config['api']['port'] == 54321
          assert config['db']['port'] == 54322
          assert config['db']['major_version'] == 17
          assert config['auth']['site_url'] == 'http://127.0.0.1:4200'

          staging = json.loads(
              Path('backend/SchoolManager.API/appsettings.Staging.json').read_text(encoding='utf-8')
          )
          assert staging['Jwt']['Issuer'] == 'http://127.0.0.1:54321/auth/v1'
          assert 'Host=127.0.0.1' in staging['ConnectionStrings']['PostgreSQL']
          assert all(
              origin.startswith(('http://127.0.0.1', 'http://localhost'))
              for origin in staging['Cors']['AllowedOrigins']
          )
          PY

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: frontend/schoolmanager-frontend/package-lock.json

      - name: Configurar npm
        run: npm install -g npm@11.13.0 --ignore-scripts

      - name: Validar Frontend (Angular)
        run: |
          cd frontend/schoolmanager-frontend
          npm ci --ignore-scripts

      - name: Validar build staging E2E sin secretos
        env:
          E2E_SUPABASE_URL: http://127.0.0.1:54321
          E2E_SUPABASE_PUBLISHABLE_KEY: e2e-local-public-key
          E2E_API_URL: http://127.0.0.1:5000/api
        run: |
          cd frontend/schoolmanager-frontend
          npm run prepare:staging
          npm run build -- --configuration staging
          MANIFEST="dist/schoolmanager-frontend/browser/e2e-runtime.staging.json"
          test -s "$MANIFEST"
          grep -F '"environment": "staging"' "$MANIFEST"
          grep -F '"production": false' "$MANIFEST"

      - name: Validar configuración Playwright E2E
        run: |
          cd e2e
          npm ci --ignore-scripts
          E2E_BASE_URL=http://127.0.0.1:4200 npm test -- --list

      - name: Ejecutar tests de rutas y funciones Vercel
        run: |
          cd frontend/schoolmanager-frontend
          npm run test:vercel

      - name: Ejecutar tests unitarios del frontend (headless, con cobertura lcov)
        run: |
          cd frontend/schoolmanager-frontend
          npm test -- --watch=false
        continue-on-error: false

      - name: Subir cobertura frontend (lcov.info) como artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: coverage-frontend-lcov
          path: frontend/schoolmanager-frontend/coverage/**/lcov.info
          if-no-files-found: error

      - name: Gate de cobertura (deuda #9, regresiones frente a baseline)
        run: |
          python3 scripts/check-coverage-gate.py \
            --backend 'coverage-backend/**/coverage.cobertura.xml' \
            --frontend 'frontend/schoolmanager-frontend/coverage/**/lcov.info'
        continue-on-error: false

      - name: Validar Frontend (Angular)
        run: |
          cd frontend/schoolmanager-frontend
          npm run build -- --configuration production

      - name: Verificar HTML inicial del login prerenderizado
        run: |
          PRERENDERED_LOGIN_HTML="frontend/schoolmanager-frontend/dist/schoolmanager-frontend/browser/login/index.html"
          test -s "${PRERENDERED_LOGIN_HTML}"
          grep -F 'type="password"' "${PRERENDERED_LOGIN_HTML}"

      - name: Verificar que producción no publique el manifest E2E
        run: |
          test ! -e "frontend/schoolmanager-frontend/dist/schoolmanager-frontend/browser/e2e-runtime.staging.json"

  sonarcloud:
    name: Análisis SonarCloud (CI Analysis)
    needs: validate-code
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          fetch-depth: 0

      - name: Descargar cobertura backend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, Node 24
        with:
          name: coverage-backend-cobertura
          path: coverage-backend

      - name: Descargar cobertura frontend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, Node 24
        with:
          name: coverage-frontend-lcov
          path: frontend/schoolmanager-frontend/coverage

      - name: Fallar si SONAR_TOKEN está vacío (anti falso-verde)
        if: ${{ env.SONAR_TOKEN == '' }}
        run: |
          echo "::error::SONAR_TOKEN no está configurado: el análisis de SonarCloud no pudo ejecutarse."
          echo "Este check queda en rojo a propósito para que un job interno nunca"
          echo "aparezca verde sin haber analizado realmente."
          echo "Configura el secret 'SONAR_TOKEN' (ver docs/ci/sonarcloud-token-setup.md)."
          exit 1

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0, Node 24
        with:
          dotnet-version: '10.0.x'

      - name: Instalar SonarScanner for .NET (11.3.0, pin fijo para reproducibilidad)
        run: dotnet tool install --global dotnet-sonarscanner --version 11.3.0

      - name: Agregar dotnet-tools al PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: SonarScanner .NET — begin (configura análisis C# + TS)
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          REF: ${{ github.ref_name }}
        run: |
          set -f
          ARGS="/k:SchoolManager /o:acevallos31 /d:sonar.token=${SONAR_TOKEN}"
          ARGS="${ARGS} /d:sonar.host.url=https://sonarcloud.io"
          ARGS="${ARGS} /d:sonar.scanner.scanAll=true"
          ARGS="${ARGS} /d:sonar.sourceEncoding=UTF-8"
          ARGS="${ARGS} /d:sonar.python.version=3.11"
          ARGS="${ARGS} /d:sonar.plsql.file.suffixes=.pks,.pkb,.pls,.plb"
          ARGS="${ARGS} /d:sonar.exclusions=**/node_modules/**,**/dist/**,**/bin/**,**/obj/**,**/coverage/**,**/*.min.js,coverage-backend/**,**/lcov.info,**/*.cobertura.xml,**/*.spec.ts,**/*.test.ts,e2e/**"
          # Tooling/CI, scripts PWA y adaptadores Vercel: se analizan estáticamente,
          # pero no forman parte del código instrumentado por Coverlet/LCOV.
          ARGS="${ARGS} /d:sonar.coverage.exclusions=scripts/check-coverage-gate.py,scripts/e2e/bootstrap-local-staging.py,frontend/schoolmanager-frontend/scripts/generate-staging-environment.mjs,frontend/schoolmanager-frontend/public/sw.js,frontend/schoolmanager-frontend/public/register-sw.js,frontend/schoolmanager-frontend/middleware.ts,frontend/schoolmanager-frontend/api/**,frontend/schoolmanager-frontend/src/main.server.ts,frontend/schoolmanager-frontend/src/app/app.config.server.ts,frontend/schoolmanager-frontend/src/app/app.routes.server.ts"
          # Baseline y migraciones son artefactos SQL históricos/versionados. La presentación
          # de la raíz es la copia entregable del recurso publicado en public/presentacion.html.
          # Se conservan en análisis estático y se excluyen solo del detector de duplicación.
          ARGS="${ARGS} /d:sonar.cpd.exclusions=database/baseline/**,database/migrations/**,schoolmanager-presentacion.html"
          ARGS="${ARGS} /d:sonar.cs.cobertura.reportsPaths=coverage-backend/**/coverage.cobertura.xml"
          ARGS="${ARGS} /d:sonar.typescript.lcov.reportPaths=frontend/schoolmanager-frontend/coverage/**/lcov.info"
          if [ -n "${PR}" ]; then
            ARGS="${ARGS} /d:sonar.pullrequest.key=${PR} /d:sonar.pullrequest.branch=${HEAD} /d:sonar.pullrequest.base=${BASE}"
          else
            ARGS="${ARGS} /d:sonar.branch.name=${REF}"
          fi
          echo "=== Iniciando SonarScanner for .NET (PR=${PR:-branch:$REF}) ==="
          dotnet sonarscanner begin ${ARGS}

      - name: Compilar Backend bajo el analizador (análisis estático C#)
        run: |
          dotnet build backend/SchoolManager.API/SchoolManager.API.csproj --configuration Release
          dotnet build tests/SchoolManager.API.IntegrationTests/SchoolManager.API.IntegrationTests.csproj --configuration Release
          dotnet build tests/SchoolManager.Database.IntegrationTests/SchoolManager.Database.IntegrationTests.csproj --configuration Release

      - name: SonarScanner .NET — end (subir análisis)
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

      - name: Verificar Quality Gate (SonarCloud)
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          scanMetadataReportFile: .sonarqube/out/.sonar/report-task.txt

      - name: Reportar condiciones del Quality Gate y hallazgos del PR
        if: ${{ always() && github.event_name == 'pull_request' && env.SONAR_TOKEN != '' }}
        env:
          SONAR_PR: ${{ github.event.pull_request.number }}
        run: python3 scripts/report-sonar-quality.py

  deploy:
    name: Desplegar a Producción
    needs: validate-code
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24

      - name: Desplegar Backend a Render
        continue-on-error: true
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Frontend desplegado por integracion de Vercel
        run: |
          echo "El frontend se despliega automaticamente desde la rama main mediante la integracion Git de Vercel."
