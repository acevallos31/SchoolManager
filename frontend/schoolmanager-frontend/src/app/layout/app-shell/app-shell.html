<div class="sm-shell" (keydown.escape)="navAbierta && cerrarNav()">

  <!-- Cabecera superior: siempre visible. Hamburguesa solo en móvil/tablet. -->
  <header class="sm-topbar">
    <button
      type="button"
      class="sm-topbar__toggle"
      [attr.aria-label]="navAbierta ? 'Cerrar menú de navegación' : 'Abrir menú de navegación'"
      [attr.aria-expanded]="navAbierta"
      aria-controls="sidebar-nav"
      (click)="alternarNav()">☰</button>

    <div class="sm-topbar__brand">
      <span class="sm-topbar__brand-name">SchoolManager</span>
      <span class="sm-topbar__brand-sub">Panel escolar</span>
    </div>

    <div class="sm-topbar__actions">
      @if (roles.length > 0) {
        <span class="sm-badge sm-badge--info" [title]="roles.join(', ')">{{ roles[0] }}</span>
      }
      <button type="button" class="sm-btn sm-btn--ghost sm-btn--sm" (click)="logout()">
        Cerrar sesión
      </button>
    </div>
  </header>

  <!-- Overlay que oscurece el contenido al abrir el drawer en móvil. -->
  @if (navAbierta) {
    <button
      type="button"
      class="sm-shell__overlay"
      aria-label="Cerrar menú"
      (click)="cerrarNav()"></button>
  }

  <!-- Sidebar: columna fija en escritorio; drawer deslizante en móvil/tablet. -->
  <aside class="sm-sidebar" [class.sm-sidebar--open]="navAbierta" aria-label="Secciones">
    <div class="sm-sidebar__brand">
      <p class="sm-eyebrow">SchoolManager</p>
      <span class="sm-sidebar__brand-name">Panel escolar</span>
    </div>

    <nav class="sm-sidebar__nav" id="sidebar-nav">
      @for (item of items; track item.ruta) {
        @if (mostrarItem(item)) {
          <a
            class="sm-sidebar__link"
            [class.sm-sidebar__link--active]="esRutaActiva(item)"
            routerLink="{{ item.ruta }}"
            (click)="cerrarNav()">
            <span class="sm-sidebar__link-dot" aria-hidden="true"></span>
            {{ item.etiqueta }}
          </a>
        }
      }
      @if (puedeVerConfiguracion) {
        <a
          class="sm-sidebar__link"
          routerLink="/configuracion"
          routerLinkActive="sm-sidebar__link--active"
          (click)="cerrarNav()">
          <span class="sm-sidebar__link-dot" aria-hidden="true"></span>
          Configuración
        </a>
      }
    </nav>

    <div class="sm-sidebar__footer">
      <span class="sm-metadata">Acceso conectado con Supabase</span>
    </div>
  </aside>

  <!-- Contenido de la ruta hija. -->
  <main class="sm-content">
    <router-outlet></router-outlet>
  </main>

</div>
