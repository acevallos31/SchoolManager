# SonarQube Cloud — configuración de análisis automático (GitHub App).
# NOTA: este archivo es el que lee el análisis automático (.sonarcloud.properties),
# no el sonar-project.properties (reservado a análisis CI/CD).

# El directorio database/baseline/ es un ARTEFACTO CONSOLIDADO/GENERADO:
# consolida el contenido de todas las migraciones en un único script para
# instalaciones nuevas (ver README y database/baseline/001_schoolmanager_fase1a.sql).
# Como es una copia de consolidación del contenido ya analizado en database/migrations/,
# se excluye SOLAMENTE de la detección de copia/duplicación (CPD) para no inflar
# la métrica de duplicación. El código productivo (migraciones, backend, frontend)
# permanece íntegramente analizado.
# (Sin patrones wildcard: restricción del análisis automático.)
sonar.cpd.exclusions=database/baseline/