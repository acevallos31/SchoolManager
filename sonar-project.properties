# =============================================================================
# SonarCloud — SchoolManager (monorepo)
# =============================================================================
# Este archivo configura el análisis de SonarCloud para el monorepo
# SchoolManager. Se ejecuta mediante CI Analysis (job sonarcloud en
# .github/workflows/deploy.yml) con la action oficial
# SonarSource/sonarqube-scan-action, que auto-aprovisiona su propio JRE y
# sonar-scanner (sin descarga manual vía wget/unzip).
#
# NOTAS:
#   - El secret SONAR_TOKEN debe existir en el repo. Si falta, la action
#     falla (job en rojo) a propósito: anti falso-verde del Bloque 029.
#   - La cobertura se importa desde los reportes que genera el job
#     validate-code (ver sección COBERTURA más abajo).
#   - Automatic Analysis NO se desactiva desde aquí; es un cambio de panel.
# =============================================================================

sonar.projectKey=SchoolManager
sonar.projectName=SchoolManager
sonar.organization=acevallos31

# Monorepo: raíz del proyecto para Sonar.
sonar.projectBaseDir=.

# ----------------------------------------------------------------------------
# CÓDIGO FUENTE Y TESTS (sin solapamiento)
# ----------------------------------------------------------------------------
# IMPORTANTE: sonar.sources y sonar.tests aceptan SOLO directorios separados
# por coma; NO admiten comodines (**/*, *). SonarScanner 8.x rechaza wildcards
# en estas dos propiedades con "Wildcards ** and * are not supported in
# 'sonar.sources' and 'sonar.tests'" (causa del fallo previo, exit code 3).

# Código productivo (se analiza y cuenta para cobertura):
#   - backend/                          -> proyecto productivo .NET (SchoolManager.API)
#   - frontend/.../src                  -> fuente Angular productiva (specs excluidos abajo)
sonar.sources=backend,frontend/schoolmanager-frontend/src

# Tests (solo directorios; se analizan como tests, NO cuentan como código productivo):
#   - tests/                            -> proyectos de integration tests (.NET)
sonar.tests=tests

# Specs de Angular colocalizados en src/** (25 *.spec.ts): Sonar no permite
# clasificar por patrón un archivo que vive dentro de un directorio declarado
# en sonar.sources como test (sonar.tests solo acepta directorios). El
# workaround estándar es EXCLUIR los specs del análisis; la cobertura sigue
# siendo correcta porque el reporte LCOV de vitest solo mide código productivo
# (los tests nunca generan líneas de cobertura que cuenten).

# Excluir artefactos, build, cobertura y los specs de la "fuente productiva"
# (no declarables como tests por patrón en un dir de sonar.sources). Sin esto,
# los .spec.ts bajo src/ inflarían el LOC productivo y falsearían las métricas.
sonar.exclusions=**/node_modules/**,**/dist/**,**/bin/**,**/obj/**,**/coverage/**,**/*.min.js,coverage-backend/**,**/lcov.info,**/*.cobertura.xml,**/*.spec.ts,**/*.test.ts

# ----------------------------------------------------------------------------
# COBERTURA — Reportes generados por el CI (job validate-code en deploy.yml)
# ----------------------------------------------------------------------------
# Backend: .NET / Coverlet en formato Cobertura.
#   Generado por: dotnet test --collect:"XPlat Code Coverage"
#                 --settings tests/SchoolManager.API.IntegrationTests/coverlet.runsettings
#                 --results-directory coverage-backend
#   Artifact CI:  coverage-backend-cobertura (coverage-backend/**/coverage.cobertura.xml)
sonar.cs.cobertura.reportsPaths=coverage-backend/**/coverage.cobertura.xml

# Frontend: Vitest / @vitest/coverage-v8 en formato LCOV.
#   Generado por: npm test -- --watch=false  (coverageReporters: lcov)
#   Artifact CI:  coverage-frontend-lcov (frontend/schoolmanager-frontend/coverage/**/lcov.info)
sonar.typescript.lcov.reportPaths=frontend/schoolmanager-frontend/coverage/**/lcov.info

# ----------------------------------------------------------------------------
# IDIOMA / CODIFICACIÓN
# ----------------------------------------------------------------------------
sonar.sourceEncoding=UTF-8
