# SonarCloud analyzer configuration.
# The database baseline is a CONSOLIDATED/GENERATED artifact used to bootstrap a
# brand-new database (see README: execute database/baseline/001_*.sql once, and
# docs/AI_CONTEXT.md: "baseline consolidado anexado"). It mechanically reproduces
# the contents of every numbered migration, so analyzing it alongside the
# authoritative sources (database/migrations/*.sql) produces spurious duplication
# on New Code (observed: new_duplicated_lines_density ~37%).
# The authoritative source of truth are the numbered migrations; the baseline is
# excluded from static analysis only (it is still shipped and used for bootstrap).
sonar.exclusions=database/baseline/**