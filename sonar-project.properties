# =============================================================================
# SonarCloud — SchoolManager (monorepo)
# =============================================================================
# Este archivo configura el análisis de SonarCloud para el monorepo
# SchoolManager. Se ejecuta mediante CI Analysis (job sonarcloud en
# .github/workflows/deploy.yml), NUNCA por Automatic Analysis.
#
# IMPORTANTE (NO desactivar):
#   - Este archivo NO desactiva Automatic Analysis. Ese es un cambio que solo
#     puede hacer el usuario en el panel de SonarCloud (ver docs/handoffs/).
#   - El job sonarcloud está CONDICIONADO a que exista el secret SONAR_TOKEN.
#     Sin él, el job se salta y la cobertura NO se importa a SonarCloud.
#   - NO afirmar que la cobertura ya se importa: solo se importa cuando el
#     usuario añade SONAR_TOKEN y desactiva Automatic Analysis.
# =============================================================================

sonar.projectKey=SchoolManager
sonar.projectName=SchoolManager
sonar.organization=acevallos31

# Monorepo: raíz del proyecto para Sonar.
sonar.projectBaseDir=.

# Incluye todo el código fuente del monorepo.
sonar.sources=.

# Excluir artefactos y directorios de build/cobertura (evitan falsos positivos
# y análisis de node_modules, que es enorme e irrelevante).
sonar.exclusions=**/node_modules/**,**/dist/**,**/bin/**,**/obj/**,**/coverage/**,**/*.min.js,coverage-backend/**,**/lcov.info,**/*.cobertura.xml

# Tests (no son código fuente, evitan falsos positivos de cobertura).
sonar.tests=.

# =============================================================================
# COBERTURA — Reportes generados por el CI (job validate-code en deploy.yml)
# =============================================================================
# Backend: .NET / Coverlet en formato Cobertura.
#   Generado por: dotnet test --collect:"XPlat Code Coverage"
#                 --settings tests/SchoolManager.API.IntegrationTests/coverlet.runsettings
#                 --results-directory coverage-backend
#   Artifact CI:  coverage-backend-cobertura (coverage-backend/**/coverage.cobertura.xml)
sonar.cs.cobertura.reportsPaths=coverage-backend/**/coverage.cobertura.xml

# Frontend: Vitest / @vitest/coverage-v8 en formato LCOV.
#   Generado por: npm test -- --watch=false  (coverageReporters: lcov)
#   Artifact CI:  coverage-frontend-lcov (frontend/schoolmanager-frontend/coverage/**/lcov.info)
sonar.typescript.lcov.reportPaths=frontend/schoolmanager-frontend/coverage/**/lcov.info

# =============================================================================
# IDIOMA / CODIFICACIÓN
# =============================================================================
sonar.sourceEncoding=UTF-8

# =============================================================================
# EXCLUSIONES (opcional, descomentar según necesidad)
# =============================================================================
# sonar.exclusions=**/*.spec.ts,**/node_modules/**,**/dist/**,**/bin/**,**/obj/**
# sonar.test.exclusions=**/*.spec.ts,**/*.test.ts,**/Tests/**
